<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XAUUSD Scalp">
<title>XAUUSD Scalping</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="#cda149" stroke-width="1.4"/>
        <path d="M12 6.2 L12 12 L16 14.4" stroke="#cda149" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark">
        <span class="ticker">XAUUSD</span>
        <span class="sub">Scalping</span>
      </div>
    </div>
  </div>

  <nav class="screen-tabs" aria-label="Screens">
    <a href="/" class="screen-tab">Daily Bias</a>
    <a href="/scalping" class="screen-tab active" aria-current="page">Scalping</a>
  </nav>

  <div class="screens">
    <section class="screen screen--idle" id="screenIdle">
      <div class="gauge-wrap" id="gaugeWrap">
        <svg class="gauge-ring" viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="98"/>
          <circle class="sweep" cx="100" cy="100" r="98"/>
        </svg>
        <button class="gauge-btn" id="startBtn">
          <svg class="gauge-icon" viewBox="0 0 24 24" fill="none" id="btnIcon">
            <path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/>
          </svg>
          <span class="gauge-label" id="btnLabel">Start</span>
          <span class="gauge-sub" id="btnSub">Run scalp</span>
        </button>
      </div>
      <p class="idle-hint">Pulls live price, order book and headlines, then builds the scalping levels and setups.</p>
      <div class="status-row" id="statusRow" style="display:none;">
        <span class="dot"></span>
        <span id="statusText">Routine running…</span>
      </div>
      <button type="button" class="last-read" id="lastReadBtn" hidden>
        <span id="lastReadText">Last read</span>
        <span class="chev">→</span>
      </button>
    </section>

    <section class="screen screen--result" id="screenResult">
      <div class="ticket">
        <div class="scalp-head" id="scalpHead">
          <div class="scalp-head-row">
            <span class="bias-pill none" id="biasPill">—</span>
            <span class="scalp-price" id="scalpPrice"></span>
          </div>
          <p class="scalp-bias-note" id="biasNote"></p>
          <div class="scalp-meta">
            <span id="updatedText"></span>
            <span class="stale-chip" id="staleChip" hidden>Stale</span>
          </div>
        </div>

        <section class="scalp-section" id="secHappened" hidden>
          <span class="section-label">What happened</span>
          <ol class="key-list" id="happenedList"></ol>
        </section>

        <section class="scalp-section" id="secLevels" hidden>
          <span class="section-label">Scalping levels</span>
          <div class="ladder" id="ladder"></div>
        </section>

        <section class="scalp-section" id="secSetups" hidden>
          <span class="section-label">Scalping setups</span>
          <div class="setup-list" id="setupList"></div>
        </section>

        <section class="scalp-section" id="secNotes" hidden>
          <span class="section-label">Notes</span>
          <ol class="key-list" id="notesList"></ol>
        </section>

        <pre class="raw-fallback" id="rawFallback" hidden></pre>
      </div>
      <a class="session-row" id="sessionLink" href="#" target="_blank" rel="noopener" hidden>
        <span>View full routine session</span>
        <span class="chev">→</span>
      </a>
      <button class="again-btn" id="againBtn">Run again</button>
    </section>
  </div>
</div>

<script>
(function () {
  const STALE_MINUTES = 20;  // a scalp read older than this gets a "Stale" chip

  const startBtn = document.getElementById('startBtn');
  const btnIcon = document.getElementById('btnIcon');
  const btnLabel = document.getElementById('btnLabel');
  const btnSub = document.getElementById('btnSub');
  const gaugeWrap = document.getElementById('gaugeWrap');
  const statusRow = document.getElementById('statusRow');
  const statusText = document.getElementById('statusText');
  const lastReadBtn = document.getElementById('lastReadBtn');
  const lastReadText = document.getElementById('lastReadText');

  const screenIdle = document.getElementById('screenIdle');
  const screenResult = document.getElementById('screenResult');
  const biasPill = document.getElementById('biasPill');
  const scalpPrice = document.getElementById('scalpPrice');
  const biasNote = document.getElementById('biasNote');
  const updatedText = document.getElementById('updatedText');
  const staleChip = document.getElementById('staleChip');
  const secHappened = document.getElementById('secHappened'), happenedList = document.getElementById('happenedList');
  const secLevels = document.getElementById('secLevels'), ladder = document.getElementById('ladder');
  const secSetups = document.getElementById('secSetups'), setupList = document.getElementById('setupList');
  const secNotes = document.getElementById('secNotes'), notesList = document.getElementById('notesList');
  const rawFallback = document.getElementById('rawFallback');
  const sessionLink = document.getElementById('sessionLink');
  const againBtn = document.getElementById('againBtn');

  let lastData = null;   // most recent /api/scalp/latest response with a report
  let pollTimer = null;
  let settleTimer = null;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function fmt(n) {
    return n == null ? '' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function updatedOf(data) {
    const d = new Date(data.report.updated || data.updated);
    return isNaN(d) ? null : d;
  }

  function ageText(d) {
    const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    const ago = mins < 1 ? 'just now' : mins < 60 ? mins + 'm ago' : Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm ago';
    return d.toISOString().slice(11, 16) + ' UTC · ' + ago;
  }

  function fillList(list, items) {
    list.innerHTML = '';
    items.forEach(function (p, i) {
      const li = el('li');
      li.appendChild(el('span', 'key-index', String(i + 1)));
      li.appendChild(el('span', null, p));
      list.appendChild(li);
    });
  }

  function renderLadder(levels, price) {
    ladder.innerHTML = '';
    let markerDone = price == null;
    levels.forEach(function (l) {
      // Current price sits between the last level above it and the first below
      if (!markerDone && l.high < price) {
        ladder.appendChild(el('div', 'price-marker', fmt(price)));
        markerDone = true;
      }
      const row = el('div', 'ladder-row' + (l.best ? ' best' : ''));
      row.appendChild(el('span', 'side-tag ' + l.side.toLowerCase(), l.side));
      row.appendChild(el('span', 'ladder-zone', l.zone));
      const note = el('span', 'ladder-note', l.note);
      if (l.best) note.appendChild(el('span', 'best-tag', 'BEST'));
      row.appendChild(note);
      ladder.appendChild(row);
    });
    if (!markerDone) ladder.appendChild(el('div', 'price-marker', fmt(price)));
  }

  function cell(k, v, vcls) {
    const c = el('div', 'setup-cell');
    c.appendChild(el('span', 'k', k));
    c.appendChild(el('span', 'v' + (vcls ? ' ' + vcls : ''), v));
    return c;
  }

  function renderSetups(setups) {
    setupList.innerHTML = '';
    setups.forEach(function (s) {
      const card = el('div', 'setup-card');
      const top = el('div', 'setup-top');
      top.appendChild(el('span', 'setup-rank', '#' + s.rank));
      top.appendChild(el('span', 'dir-pill ' + s.direction.toLowerCase(), s.direction));
      if (s.confidence) {
        top.appendChild(el('span', 'confidence-chip ' + s.confidence.toLowerCase(), s.confidence));
      }
      card.appendChild(top);
      if (s.trigger) card.appendChild(el('p', 'setup-trigger', s.trigger));
      const grid = el('div', 'setup-grid');
      grid.appendChild(cell('Entry', s.entry));
      grid.appendChild(cell('Stop', s.stop, 'stop'));
      grid.appendChild(cell('Targets', s.targets.join(' → '), 'tgt'));
      card.appendChild(grid);
      setupList.appendChild(card);
    });
  }

  function renderTicket(data) {
    const r = data.report;
    biasPill.className = 'bias-pill ' + ({ BULLISH: 'buy', BEARISH: 'sell' }[r.bias] || 'none');
    biasPill.textContent = r.bias || 'NO READ';
    scalpPrice.textContent = fmt(r.price);
    biasNote.textContent = r.bias_note || '';
    biasNote.hidden = !r.bias_note;

    const updated = updatedOf(data);
    updatedText.textContent = updated ? 'Updated ' + ageText(updated) : '';
    staleChip.hidden = !updated || (Date.now() - updated.getTime()) / 60000 <= STALE_MINUTES;

    const usable = data.usable;
    rawFallback.hidden = usable;
    if (!usable) rawFallback.textContent = r.raw || '(empty event)';

    secHappened.hidden = !usable || !r.happened.length;
    fillList(happenedList, usable ? r.happened : []);
    secLevels.hidden = !usable || !r.levels.length;
    renderLadder(usable ? r.levels : [], r.price);
    secSetups.hidden = !usable || !r.setups.length;
    renderSetups(usable ? r.setups : []);
    secNotes.hidden = !usable || !r.notes.length;
    fillList(notesList, usable ? r.notes : []);
  }

  function renderTimeout() {
    biasPill.className = 'bias-pill none';
    biasPill.textContent = 'TIMED OUT';
    scalpPrice.textContent = '';
    biasNote.hidden = true;
    updatedText.textContent = '';
    staleChip.hidden = true;
    secHappened.hidden = secLevels.hidden = secSetups.hidden = secNotes.hidden = true;
    rawFallback.hidden = false;
    rawFallback.textContent = 'Timed out waiting for the calendar event. Check the session directly.';
  }

  function setSession(url) {
    sessionLink.hidden = !url;
    if (url) sessionLink.href = url;
  }

  function showLastRead() {
    const d = lastData && updatedOf(lastData);
    lastReadBtn.hidden = !d;
    if (d) lastReadText.textContent = 'Last read · ' + ageText(d);
  }

  function setPending(isPending) {
    startBtn.disabled = isPending;
    gaugeWrap.classList.toggle('pending', isPending);
    btnIcon.style.display = isPending ? 'none' : '';
    btnLabel.textContent = isPending ? '' : 'Start';
    btnSub.textContent = isPending ? '' : 'Run scalp';
    if (isPending) lastReadBtn.hidden = true;
  }

  function setStatus(text, isError) {
    statusRow.style.display = 'flex';
    statusRow.classList.toggle('error', !!isError);
    statusText.textContent = text;
  }

  function goToResult() {
    screenIdle.classList.add('leaving');
    screenResult.classList.add('entered');
    // Same as Daily Bias: after the slide-in, drop back into normal flow so
    // the page grows to fit the whole ticket.
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () {
      screenResult.style.position = 'relative';
    }, 480);
  }

  function reset() {
    clearTimeout(settleTimer);
    screenResult.style.position = '';
    screenIdle.classList.remove('leaving');
    screenResult.classList.remove('entered');
    statusRow.style.display = 'none';
    setPending(false);
    showLastRead();
  }

  async function startScalp() {
    setPending(true);
    setStatus('Firing routine…', false);

    let res;
    try {
      res = await fetch('/api/scalp/refresh', { method: 'POST' });
    } catch (e) {
      setStatus('Failed to start — ' + e.message, true);
      setPending(false);
      return;
    }

    if (!res.ok) {
      let detail = res.statusText || 'unknown error';
      try { detail = (await res.json()).detail || detail; } catch (e) {}
      setStatus('Failed to start — ' + detail, true);
      setPending(false);
      return;
    }

    setStatus('Routine running…', false);
    pollStatus();
  }

  async function pollStatus() {
    let data;
    try {
      data = await (await fetch('/api/scalp/latest')).json();
    } catch (e) {
      setPending(false);
      setStatus('Lost connection while checking status — ' + e.message, true);
      return;
    }

    const run = data.refresh || {};
    if (data.status === 'error') {
      setPending(false);
      setStatus('Status check failed — ' + (data.detail || 'unknown error'), true);
      return;
    }
    if (run.pending) {
      setStatus('Routine running… (' + run.elapsed_seconds + 's)', false);
      pollTimer = setTimeout(pollStatus, 5000);
      return;
    }

    setPending(false);
    setSession(run.session_url);
    if (run.timed_out || data.status !== 'ok') {
      renderTimeout();
    } else {
      lastData = data;
      renderTicket(data);
    }
    goToResult();
  }

  // On load: offer the last read, and pick up a run that's still going
  // (e.g. the page was reloaded mid-run).
  async function init() {
    let data;
    try {
      data = await (await fetch('/api/scalp/latest')).json();
    } catch (e) {
      return;
    }
    if (data.status === 'ok') lastData = data;
    if (data.refresh && data.refresh.pending) {
      setPending(true);
      setStatus('Routine running…', false);
      pollStatus();
      return;
    }
    showLastRead();
  }

  startBtn.addEventListener('click', startScalp);
  againBtn.addEventListener('click', reset);
  lastReadBtn.addEventListener('click', function () {
    renderTicket(lastData);
    setSession(lastData.refresh && lastData.refresh.session_url);
    goToResult();
  });
  init();
})();
</script>
</body>
</html>
