<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XAUUSD Bias">
<title>XAUUSD Daily Bias</title>
<style>
  :root {
    --ink: #08090b;
    --panel: #131418;
    --panel-raised: #1a1b21;
    --hairline: #2a2b33;
    --hairline-soft: rgba(255,255,255,0.06);
    --paper: #eceef2;
    --ink-2: #7c7e8c;
    --gold: #cda149;
    --gold-dim: rgba(205, 161, 73, 0.14);
    --buy: #35c78a;
    --buy-dim: rgba(53, 199, 138, 0.14);
    --sell: #e5566a;
    --sell-dim: rgba(229, 86, 106, 0.14);
    --none: #6f8fae;
    --none-dim: rgba(111, 143, 174, 0.14);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--ink);
    color: var(--paper);
  }

  body {
    margin: 0;
    font-family: var(--font-display);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .app-shell {
    width: 100%;
    max-width: 460px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(205,161,73,0.10) 0%, rgba(205,161,73,0) 60%),
      var(--ink);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 24px 14px;
    flex-shrink: 0;
  }

  .mark { width: 26px; height: 26px; flex-shrink: 0; }

  .wordmark { display: flex; flex-direction: column; line-height: 1.15; }

  .wordmark .ticker {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.02em;
    color: var(--paper);
  }

  .wordmark .sub {
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .screens {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px 32px;
    transition: transform 0.46s cubic-bezier(.22,.9,.32,1), opacity 0.4s ease;
  }

  .screen--idle { justify-content: center; transform: translateX(0); opacity: 1; }
  .screen--idle.leaving { transform: translateX(-22%); opacity: 0; }

  .screen--result {
    justify-content: flex-start;
    padding-top: 6vh;
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .screen--result.entered { transform: translateX(0); opacity: 1; pointer-events: auto; }

  /* ---- Idle screen ---- */

  .gauge-wrap {
    position: relative;
    width: 216px;
    height: 216px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gauge-ring { position: absolute; inset: 0; transform: rotate(-90deg); pointer-events: none; }
  .gauge-ring circle { fill: none; stroke-width: 1.5; }
  .gauge-ring .track { stroke: var(--hairline); }

  .gauge-ring .sweep {
    stroke: var(--gold);
    stroke-linecap: round;
    stroke-dasharray: 40 616;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .gauge-wrap.pending .gauge-ring .sweep {
    opacity: 1;
    animation: sweep-rotate 1.35s linear infinite;
  }

  @keyframes sweep-rotate { to { transform: rotate(360deg); } }

  .gauge-btn {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: linear-gradient(160deg, var(--panel-raised), var(--panel) 70%);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, border-color 0.3s ease;
  }

  .gauge-btn:active { transform: scale(0.96); }
  .gauge-btn:not(:disabled):hover { border-color: rgba(205, 161, 73, 0.5); }
  .gauge-btn:disabled { cursor: default; }

  .gauge-icon { width: 30px; height: 30px; color: var(--gold); }
  .gauge-label { font-size: 15px; font-weight: 650; letter-spacing: 0.02em; }

  .gauge-sub {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .idle-hint {
    margin: 28px 0 0;
    font-size: 13.5px;
    color: var(--ink-2);
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }

  .status-row {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  .status-row.error { color: var(--sell); }

  .status-row .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse-dot 1.4s ease-in-out infinite;
  }

  .status-row.error .dot { background: var(--sell); animation: none; }

  @keyframes pulse-dot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* ---- Result screen (trade ticket) ---- */

  .ticket {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6);
  }

  .ticket-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 22px 22px 20px;
  }

  .bias-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .bias-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  .bias-pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .bias-pill.buy { background: var(--buy-dim); color: var(--buy); }
  .bias-pill.sell { background: var(--sell-dim); color: var(--sell); }
  .bias-pill.none { background: var(--none-dim); color: var(--none); }

  .confidence-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .confidence-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .confidence-chip.low { background: var(--sell-dim); color: var(--sell); }
  .confidence-chip.medium { background: var(--gold-dim); color: var(--gold); }
  .confidence-chip.high { background: var(--buy-dim); color: var(--buy); }
  .confidence-chip.neutral { background: transparent; border-color: var(--hairline); color: var(--ink-2); }
  .confidence-chip.neutral::before { display: none; }
  .confidence-chip[hidden] { display: none; }

  .ticket-time {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .perforation {
    position: relative;
    height: 1px;
    background: repeating-linear-gradient(to right, var(--hairline) 0 6px, transparent 6px 12px);
    margin: 0;
  }

  .perforation::before, .perforation::after {
    content: "";
    position: absolute;
    top: -9px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--ink);
    border: 1px solid var(--hairline);
  }

  .perforation::before { left: -10px; }
  .perforation::after { right: -10px; }

  .ticket-stats { display: flex; flex-direction: column; }
  .ticket-stats > * + * { border-top: 1px solid var(--hairline-soft); }
  .ticket-stats[hidden] { display: none; }

  .stat-row { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 22px; gap: 12px; }
  .stat-row[hidden] { display: none; }
  .stat-label { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .stat-value { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--paper); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .stat-value-group { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .stat-delta { font-family: var(--font-mono); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-delta.above { color: var(--buy); }
  .stat-delta.below { color: var(--sell); }

  .stat-block { padding: 13px 22px; }
  .stat-block[hidden] { display: none; }
  .stat-prose { margin: 6px 0 0; font-size: 13px; line-height: 1.55; color: var(--paper); }

  .ticket-keypoints { padding: 18px 22px 22px; border-top: 1px solid var(--hairline); }
  .ticket-keypoints[hidden] { display: none; }
  .section-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
  .key-summary { margin: 0 0 14px; font-size: 13.5px; line-height: 1.6; font-weight: 500; color: var(--paper); }
  .key-summary[hidden] { display: none; }

  .key-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .key-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--paper); }
  .key-index {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 5px;
    background: var(--gold-dim);
    color: var(--gold);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }

  .raw-fallback {
    margin: 0;
    padding: 22px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.75;
    color: var(--paper);
    white-space: pre-wrap;
  }
  .raw-fallback[hidden] { display: none; }

  .session-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 2px 0;
    padding: 15px 16px;
    border: 1px solid var(--hairline);
    border-radius: 14px;
    color: var(--paper);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 550;
    background: var(--panel);
    transition: transform 0.15s ease, border-color 0.2s ease;
  }

  .session-row[hidden] { display: none; }
  .session-row:active { transform: scale(0.98); }
  .session-row:hover { border-color: rgba(205,161,73,0.4); }
  .session-row .chev { color: var(--gold); font-family: var(--font-mono); }

  .again-btn {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.15s ease;
  }

  .again-btn:active { transform: scale(0.98); }
  .again-btn:hover { color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    .screen, .gauge-btn, .session-row, .again-btn { transition: none !important; }
    .gauge-ring .sweep, .status-row .dot { animation: none !important; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <svg class="mark" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9.5" stroke="#cda149" stroke-width="1.4"/>
      <path d="M12 6.2 L12 12 L16 14.4" stroke="#cda149" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="wordmark">
      <span class="ticker">XAUUSD</span>
      <span class="sub">Daily Bias</span>
    </div>
  </div>

  <div class="screens">
    <section class="screen screen--idle" id="screenIdle">
      <div class="gauge-wrap" id="gaugeWrap">
        <svg class="gauge-ring" viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="98"/>
          <circle class="sweep" cx="100" cy="100" r="98"/>
        </svg>
        <button class="gauge-btn" id="startBtn">
          <svg class="gauge-icon" viewBox="0 0 24 24" fill="none" id="btnIcon">
            <path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/>
          </svg>
          <span class="gauge-label" id="btnLabel">Start</span>
          <span class="gauge-sub" id="btnSub">Run bias</span>
        </button>
      </div>
      <p class="idle-hint">Fires the structural + intraday read and pulls the result straight from Calendar.</p>
      <div class="status-row" id="statusRow" style="display:none;">
        <span class="dot"></span>
        <span id="statusText">Routine running…</span>
      </div>
    </section>

    <section class="screen screen--result" id="screenResult">
      <div class="ticket">
        <div class="ticket-head">
          <div class="bias-group">
            <span class="bias-pill none" id="biasPill">—</span>
            <span class="confidence-chip" id="confChip" hidden></span>
          </div>
          <span class="ticket-time" id="ticketTime"></span>
        </div>
        <div class="perforation"></div>
        <div class="ticket-stats" id="ticketStats">
          <div class="stat-row" id="rowPrice" hidden>
            <span class="stat-label">Current Price</span>
            <span class="stat-value" id="valPrice"></span>
          </div>
          <div class="stat-row" id="rowSma50" hidden>
            <span class="stat-label">SMA 50</span>
            <span class="stat-value-group">
              <span class="stat-value" id="valSma50"></span>
              <span class="stat-delta" id="deltaSma50"></span>
            </span>
          </div>
          <div class="stat-row" id="rowSma100" hidden>
            <span class="stat-label">SMA 100</span>
            <span class="stat-value-group">
              <span class="stat-value" id="valSma100"></span>
              <span class="stat-delta" id="deltaSma100"></span>
            </span>
          </div>
          <div class="stat-block" id="rowAlign" hidden>
            <span class="stat-label">Timeframe Alignment</span>
            <p class="stat-prose" id="valAlign"></p>
          </div>
        </div>
        <div class="ticket-keypoints" id="keySection" hidden>
          <span class="section-label">Key Points</span>
          <p class="key-summary" id="keySummary"></p>
          <ol class="key-list" id="keyList"></ol>
        </div>
        <pre class="raw-fallback" id="rawFallback" hidden></pre>
      </div>
      <a class="session-row" id="sessionLink" href="#" target="_blank" rel="noopener" hidden>
        <span>View full routine session</span>
        <span class="chev">→</span>
      </a>
      <button class="again-btn" id="againBtn">Run again</button>
    </section>
  </div>
</div>

<script>
(function () {
  const startBtn = document.getElementById('startBtn');
  const btnIcon = document.getElementById('btnIcon');
  const btnLabel = document.getElementById('btnLabel');
  const btnSub = document.getElementById('btnSub');
  const gaugeWrap = document.getElementById('gaugeWrap');
  const statusRow = document.getElementById('statusRow');
  const statusText = document.getElementById('statusText');

  const screenIdle = document.getElementById('screenIdle');
  const screenResult = document.getElementById('screenResult');
  const biasPill = document.getElementById('biasPill');
  const confChip = document.getElementById('confChip');
  const ticketTime = document.getElementById('ticketTime');
  const rowPrice = document.getElementById('rowPrice'), valPrice = document.getElementById('valPrice');
  const rowSma50 = document.getElementById('rowSma50'), valSma50 = document.getElementById('valSma50'), deltaSma50 = document.getElementById('deltaSma50');
  const rowSma100 = document.getElementById('rowSma100'), valSma100 = document.getElementById('valSma100'), deltaSma100 = document.getElementById('deltaSma100');
  const rowAlign = document.getElementById('rowAlign'), valAlign = document.getElementById('valAlign');
  const keySection = document.getElementById('keySection');
  const keySummary = document.getElementById('keySummary');
  const keyList = document.getElementById('keyList');
  const rawFallback = document.getElementById('rawFallback');
  const sessionLink = document.getElementById('sessionLink');
  const againBtn = document.getElementById('againBtn');

  let pollTimer = null;

  function parseReport(desc) {
    desc = desc || '';
    const biasMatch = desc.match(/BIAS:\s*(BUY|SELL|NONE)/i);
    const bias = biasMatch ? biasMatch[1].toUpperCase() : null;

    const confMatch = desc.match(/Confidence:\s*([A-Za-z]+)/i);
    const confidence = confMatch ? confMatch[1] : null;

    const priceLine = desc.match(/Price:\s*([\d,.]+)\s*\|\s*vs SMA50:\s*(above|below)\s*by\s*([\d,.]+)\s*\|\s*vs SMA100:\s*(above|below)\s*by\s*([\d,.]+)/i);
    let price = null, sma50 = null, dir50 = null, delta50 = null, sma100 = null, dir100 = null, delta100 = null;
    if (priceLine) {
      price = parseFloat(priceLine[1].replace(/,/g, ''));
      dir50 = priceLine[2].toLowerCase();
      delta50 = parseFloat(priceLine[3].replace(/,/g, ''));
      sma50 = dir50 === 'above' ? price - delta50 : price + delta50;
      dir100 = priceLine[4].toLowerCase();
      delta100 = parseFloat(priceLine[5].replace(/,/g, ''));
      sma100 = dir100 === 'above' ? price - delta100 : price + delta100;
    }

    const alignMatch = desc.match(/Timeframe alignment:\s*(.+)/i);
    const alignment = alignMatch ? alignMatch[1].trim() : null;

    const whyMatch = desc.match(/Why:\s*(.+)/i);
    const summary = whyMatch ? whyMatch[1].trim() : null;

    const pointsMatch = desc.match(/Key pointers[^\n]*\n([\s\S]*?)\n\s*\nBIAS:/i);
    let points = [];
    if (pointsMatch) {
      points = pointsMatch[1].split('\n')
        .map(function (l) { return l.trim(); })
        .filter(function (l) { return l.indexOf('-') === 0; })
        .map(function (l) { return l.replace(/^-+\s*/, ''); });
    }

    return {
      bias: bias, confidence: confidence,
      price: price,
      sma50: sma50, dir50: dir50, delta50: delta50,
      sma100: sma100, dir100: dir100, delta100: delta100,
      alignment: alignment, summary: summary, points: points
    };
  }

  function fmt(n) {
    return n == null ? null : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function deltaText(dir, delta) {
    if (dir == null || delta == null) return null;
    return (dir === 'above' ? 'Above by ' : 'Below by ') + fmt(delta);
  }

  function renderTicket(bias, confidence, desc, fallbackTitle) {
    const r = parseReport(desc);
    const finalBias = bias || r.bias;

    biasPill.className = 'bias-pill ' + (finalBias ? finalBias.toLowerCase() : 'none');
    biasPill.textContent = finalBias || fallbackTitle || 'RESULT';

    const conf = confidence || r.confidence;
    const confKey = conf ? conf.toLowerCase() : null;
    const confClass = ['low', 'medium', 'high'].indexOf(confKey) !== -1 ? confKey : 'neutral';
    confChip.hidden = !conf;
    if (conf) {
      confChip.className = 'confidence-chip ' + confClass;
      confChip.textContent = conf + ' confidence';
    }

    ticketTime.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    rowPrice.hidden = r.price == null;
    if (r.price != null) valPrice.textContent = fmt(r.price);

    rowSma50.hidden = r.sma50 == null;
    if (r.sma50 != null) {
      valSma50.textContent = fmt(r.sma50);
      deltaSma50.textContent = deltaText(r.dir50, r.delta50);
      deltaSma50.className = 'stat-delta ' + r.dir50;
    }

    rowSma100.hidden = r.sma100 == null;
    if (r.sma100 != null) {
      valSma100.textContent = fmt(r.sma100);
      deltaSma100.textContent = deltaText(r.dir100, r.delta100);
      deltaSma100.className = 'stat-delta ' + r.dir100;
    }

    rowAlign.hidden = !r.alignment;
    if (r.alignment) valAlign.textContent = r.alignment;

    const hasKeyContent = r.summary || r.points.length;
    keySection.hidden = !hasKeyContent;
    if (hasKeyContent) {
      keySummary.hidden = !r.summary;
      if (r.summary) keySummary.textContent = r.summary;
      keyList.innerHTML = '';
      r.points.forEach(function (p, i) {
        const li = document.createElement('li');
        const ix = document.createElement('span');
        ix.className = 'key-index';
        ix.textContent = String(i + 1);
        const tx = document.createElement('span');
        tx.textContent = p;
        li.appendChild(ix);
        li.appendChild(tx);
        keyList.appendChild(li);
      });
    }

    const nothingParsed = r.price == null && !r.alignment && !hasKeyContent;
    rawFallback.hidden = !nothingParsed;
    if (nothingParsed) rawFallback.textContent = desc || '(no description found)';
  }

  function setPending(isPending) {
    startBtn.disabled = isPending;
    gaugeWrap.classList.toggle('pending', isPending);
    btnIcon.style.display = isPending ? 'none' : '';
    btnLabel.textContent = isPending ? '' : 'Start';
    btnSub.textContent = isPending ? '' : 'Run bias';
  }

  function setStatus(text, isError) {
    statusRow.style.display = 'flex';
    statusRow.classList.toggle('error', !!isError);
    statusText.textContent = text;
  }

  let settleTimer = null;

  function goToResult() {
    screenIdle.classList.add('leaving');
    screenResult.classList.add('entered');
    // Once the slide-in finishes, drop out of the absolute overlay stack
    // and back into normal flow so the page grows to fit the full ticket
    // (price/SMA/key points) instead of being clipped to one screen height.
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () {
      screenResult.style.position = 'relative';
    }, 480);
  }

  function reset() {
    clearTimeout(settleTimer);
    screenResult.style.position = '';
    screenIdle.classList.remove('leaving');
    screenResult.classList.remove('entered');
    statusRow.style.display = 'none';
    setPending(false);
  }

  async function startBot() {
    setPending(true);
    setStatus('Firing routine…', false);

    let res;
    try {
      res = await fetch('/api/start', { method: 'POST' });
    } catch (e) {
      setStatus('Failed to start — ' + e.message, true);
      setPending(false);
      return;
    }

    if (!res.ok) {
      let detail = '';
      try {
        const err = await res.json();
        detail = err.detail || JSON.stringify(err);
      } catch (e) {
        detail = res.statusText || 'unknown error';
      }
      setStatus('Failed to start — ' + detail, true);
      setPending(false);
      return;
    }

    setStatus('Routine running…', false);
    pollStatus();
  }

  async function pollStatus() {
    const res = await fetch('/api/status');
    const data = await res.json();

    if (data.status === 'pending') {
      setStatus('Routine running… (' + data.elapsed_seconds + 's)', false);
      pollTimer = setTimeout(pollStatus, 5000);
      return;
    }

    setPending(false);

    if (data.status === 'done') {
      renderTicket(null, null, data.description, data.title);

      if (data.session_url) {
        sessionLink.href = data.session_url;
        sessionLink.hidden = false;
      } else {
        sessionLink.hidden = true;
      }

      goToResult();
    } else if (data.status === 'timeout') {
      biasPill.className = 'bias-pill none';
      biasPill.textContent = 'TIMED OUT';
      confChip.hidden = true;
      ticketTime.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      rowPrice.hidden = rowSma50.hidden = rowSma100.hidden = rowAlign.hidden = true;
      keySection.hidden = true;
      rawFallback.hidden = false;
      rawFallback.textContent = 'Timed out waiting for the calendar event. Check the session directly.';

      if (data.session_url) {
        sessionLink.href = data.session_url;
        sessionLink.hidden = false;
      } else {
        sessionLink.hidden = true;
      }

      goToResult();
    } else {
      setStatus('Unexpected status: ' + data.status, true);
    }
  }

  startBtn.addEventListener('click', startBot);
  againBtn.addEventListener('click', reset);
})();
</script>
</body>
</html>
