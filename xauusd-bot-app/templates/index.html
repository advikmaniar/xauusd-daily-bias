<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XAUUSD Bias Bot</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --buy: #2fbf71;
    --sell: #e5484d;
    --none: #d7a52c;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.1); }

  .status-line {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: none;
  }
  .bias-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .bias-badge.buy { background: rgba(47,191,113,0.15); color: var(--buy); }
  .bias-badge.sell { background: rgba(229,72,77,0.15); color: var(--sell); }
  .bias-badge.none { background: rgba(215,165,44,0.15); color: var(--none); }

  .card pre {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin: 0;
  }
  .session-link {
    display: inline-block;
    margin-top: 16px;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

  <h1>XAUUSD Daily Bias</h1>
  <div class="sub">Fires the Claude Code routine and pulls the result straight from Calendar.</div>

  <button id="startBtn">Start Bot</button>

  <div class="status-line" id="statusLine" style="display:none;">
    <div class="spinner" id="spinner"></div>
    <span id="statusText"></span>
  </div>

  <div class="card" id="resultCard">
    <div id="biasBadge" class="bias-badge"></div>
    <pre id="reportText"></pre>
    <a id="sessionLink" class="session-link" href="#" target="_blank">View full routine session →</a>
  </div>

<script>
const startBtn = document.getElementById('startBtn');
const statusLine = document.getElementById('statusLine');
const statusText = document.getElementById('statusText');
const spinner = document.getElementById('spinner');
const resultCard = document.getElementById('resultCard');
const biasBadge = document.getElementById('biasBadge');
const reportText = document.getElementById('reportText');
const sessionLink = document.getElementById('sessionLink');

let pollTimer = null;

function setStatus(text, showSpinner) {
  statusLine.style.display = 'flex';
  statusText.textContent = text;
  spinner.style.display = showSpinner ? 'inline-block' : 'none';
}

function detectBias(text) {
  const match = text.match(/BIAS:\s*(BUY|SELL|NONE)/i);
  return match ? match[1].toUpperCase() : null;
}

async function startBot() {
  startBtn.disabled = true;
  resultCard.style.display = 'none';
  setStatus('Firing routine...', true);

  const res = await fetch('/api/start', { method: 'POST' });
  if (!res.ok) {
    let detail = '';
    try {
      const err = await res.json();
      detail = err.detail || JSON.stringify(err);
    } catch (e) {
      detail = res.statusText || 'unknown error';
    }
    setStatus('Failed to start — ' + detail, false);
    startBtn.disabled = false;
    return;
  }

  setStatus('Routine running — waiting for result...', true);
  pollStatus();
}

async function pollStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();

  if (data.status === 'pending') {
    setStatus(`Routine running — waiting for result... (${data.elapsed_seconds}s)`, true);
    pollTimer = setTimeout(pollStatus, 5000);
  } else if (data.status === 'done') {
    setStatus('Done.', false);
    startBtn.disabled = false;

    const bias = detectBias(data.description || '');
    biasBadge.textContent = bias ? `BIAS: ${bias}` : (data.title || 'Result');
    biasBadge.className = 'bias-badge ' + (bias ? bias.toLowerCase() : '');

    reportText.textContent = data.description || '(no description found)';
    sessionLink.href = data.session_url || '#';
    resultCard.style.display = 'block';
  } else if (data.status === 'timeout') {
    setStatus('Timed out waiting for the calendar event. Check the session directly.', false);
    startBtn.disabled = false;
    if (data.session_url) {
      sessionLink.href = data.session_url;
      sessionLink.textContent = 'View routine session →';
      resultCard.style.display = 'block';
    }
  } else {
    setStatus('Unexpected status: ' + data.status, false);
    startBtn.disabled = false;
  }
}

startBtn.addEventListener('click', startBot);
</script>
</body>
</html>
